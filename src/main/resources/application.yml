server:
  port: 9000
  forward-headers-strategy: native
  tomcat:
    remoteip:
      remote-ip-header: x-forwarded-for
      protocol-header: x-forwarded-proto

spring:
  application:
    name: auth

  profiles:
    active: dev # 기본 실행 시 application-dev.yml을 읽음 (로컬용)

management:
  tracing:
    sampling:
      probability: 1.0
  endpoints:
    web:
      exposure:
        include: health, info, prometheus, metrics # 메트릭은 항상 노출